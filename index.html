<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quraq Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-screen WebGL board, ornament panel floating at the bottom, restart in the top corner */
:root {
  --table: #241815; --panel: #f4ece3; --ink: #2b1c18; --accent: #862522; --ring: rgba(244,236,227,.55);
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body { background: var(--table); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

.panel { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 140%); transition: transform .55s cubic-bezier(.2,.9,.25,1.15);
  display: flex; gap: 10px; padding: 10px; background: var(--panel); border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.panel.open { transform: translate(-50%, 0); }
.orn { width: 64px; height: 64px; border-radius: 12px; border: 2px solid transparent; background: transparent;
  color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; transition: background .2s, border-color .2s, transform .2s; }
.orn svg { width: 44px; height: 44px; }
.orn:hover { background: rgba(43,28,24,.07); }
.orn[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.orn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.orn.wiggle { animation: wiggle .5s; }
@keyframes wiggle { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-9deg) } 75% { transform: rotate(9deg) } }

.restart { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: calc(14px + env(safe-area-inset-right, 0px));
  width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(244,236,227,.1); color: var(--panel);
  display: grid; place-items: center; cursor: pointer; transition: background .2s; }
.restart:hover { background: rgba(244,236,227,.2); }
.restart:focus-visible { outline: 2px solid var(--panel); outline-offset: 2px; }
.restart svg { width: 22px; height: 22px; }
.restart.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--ring) } 50% { box-shadow: 0 0 0 10px rgba(244,236,227,0) } }
/* save the finished quilt: rises at the bottom centre, where the panel was, once the thread is cut */
.save { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 64px; height: 64px;
  border-radius: 18px; border: 0; background: var(--panel); color: var(--ink); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 10px 30px rgba(0,0,0,.45); transform: translate(-50%, 160%); transition: transform .55s cubic-bezier(.2,.9,.25,1.15); padding: 0; }
.save.show { transform: translate(-50%, 0); }
.save:hover { background: #fffaf3; }
.save:focus-visible { outline: 2px solid var(--panel); outline-offset: 3px; }
.save svg { width: 34px; height: 34px; }
.save .tick { display: none; }
.save.saved .tick { display: block; } .save.saved .tray { display: none; }
/* Legend: what the ornaments mean (left of the quilt). It must not look like the tool panel: the tools are square
   monochrome buttons on a cream tray at the bottom; the legend is a column of small round fabric swatches in their real
   colours, strung on a dashed thread like tags, under a small caption. Pressing one opens a card with the meaning
   (from the @by.rabat flyer; the card itself names no source) and, for an ornament, the tool icon that sews it. It never selects a tool. */
.legend { position: fixed; z-index: 12; left: calc(18px + env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 6px 0; }
.legend::before { content: ""; position: absolute; top: 34px; bottom: 26px; left: 50%; border-left: 1.5px dashed rgba(244,236,227,.28); }
.legend .cap { color: rgba(244,236,227,.55); font-size: 11px; letter-spacing: .14em; text-transform: lowercase; margin-bottom: 2px;
  width: 76px; text-align: center; line-height: 1.35; }   /* two lines, so it stays over the narrow column */
.swatch { position: relative; width: 46px; height: 46px; border-radius: 50%; padding: 0; cursor: pointer; overflow: hidden;
  border: 0; background: var(--table); box-shadow: 0 0 0 2px var(--table), 0 0 0 3.5px rgba(244,236,227,.35); transition: transform .2s, box-shadow .2s; }
.swatch img { width: 100%; height: 100%; display: block; object-fit: cover; }
.swatch::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; border: 1.5px dashed rgba(244,236,227,.7); }  /* the stitched edge */
.swatch:hover { transform: scale(1.06); }
.swatch[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--table), 0 0 0 3.5px var(--panel); transform: scale(1.06); }
.swatch:focus-visible { outline: 2px solid var(--panel); outline-offset: 5px; }
.legend-shade { position: fixed; inset: 0; z-index: 10; display: none; }
.legend-shade.show { display: block; }
.card { position: fixed; z-index: 11; max-width: min(300px, calc(100vw - 32px)); padding: 16px 18px 14px; background: var(--panel); color: var(--ink);
  border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45); font-size: 14px; line-height: 1.45; display: none;
  outline: 1.5px dashed rgba(43,28,24,.3); outline-offset: -7px; }
.card.show { display: block; animation: cardIn .25s ease-out; }
@keyframes cardIn { from { opacity: 0; transform: translateX(-6px); } }
.card h2 { margin: 0; font-size: 17px; font-weight: 600; }
.card .kk { margin: 1px 0 8px; color: rgba(43,28,24,.6); font-size: 13px; }
.card p { margin: 0 0 8px; }
.card .tool { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 9px; border-top: 1px solid rgba(43,28,24,.15); font-size: 13px; color: rgba(43,28,24,.75); }
.card .tool svg { width: 26px; height: 26px; flex: none; }
/* portrait: no room beside the quilt, so the legend is a row in the top-left corner and the card opens below it */
@media (max-aspect-ratio: 6/5) {
  .legend { top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); transform: none; flex-direction: row; padding: 0; gap: 12px; }
  .legend::before { top: 50%; bottom: auto; left: 30px; right: 20px; border-left: 0; border-top: 1.5px dashed rgba(244,236,227,.28); }
  .legend .cap { display: none; }
  .swatch { width: 40px; height: 40px; }
}
@media (prefers-reduced-motion: reduce) { .card.show { animation: none; } .swatch, .swatch:hover { transition: none; transform: none; } }
@media (prefers-reduced-motion: reduce) { .panel, .save { transition: none; } .orn.wiggle, .restart.pulse { animation: none; } }
</style>
</head>

const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

const slow = REDUCED ? .35 : 1;

// ---------- Sound: ASMR fabric foley ----------
// Every sound is made with Web Audio from one buffer of noise, so there are no files (the image serves only this page
// and levels/). Cloth is band-passed noise; the needle piercing is a tiny high click with a soft give under it; thread
// pulled tight is a narrow band sweeping up; a landing is a low, muffled thump. The silver of the needle (the star,
// the ending) is a few quiet high sine partials, the one tonal colour. No two stitches sound alike: pitch, filter and
// timing vary a little on every call. Sounds are panned by where on the quilt they happen, with a little room.
// Browsers start audio only after a gesture: the first tap or key wakes it. M mutes.
const SFX = (() => {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  let ac = null, out = null, verb = null, noiseBuf = null, muted = false;
  const rnd = (a, b) => a + Math.random() * (b - a);

    if (!Ctx) return;

      ac = new Ctx();
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(ac.destination);
      out = ac.createGain(); out.gain.value = muted ? 0 : .9; out.connect(comp);
      const n = ac.sampleRate * 2; noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      // a small soft room: 0.9 s of decaying stereo noise
      const L = Math.floor(ac.sampleRate * .9), ir = ac.createBuffer(2, L, ac.sampleRate);
      for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < L; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / L, 3); }
      verb = ac.createConvolver(); verb.buffer = ir; const vg = ac.createGain(); vg.gain.value = .35; verb.connect(vg); vg.connect(out);
    }

  }
  // Sounds are scheduled as soon as audio exists: one asked for in the waking gesture plays once it has resumed.
  const ready = () => !!ac && !muted;
  function send(node, pan, wet) {
    let n = node;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); n.connect(p); n = p; }
    n.connect(out);

  }
  function env(g, t0, peak, attack, dur) {
    g.gain.setValueAtTime(.0001, t0);

    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);

  function noise({ at = 0, dur = .2, type = "bandpass", f = 2000, f2 = f, q = 1, gain = .2, attack = .01, pan = 0, wet = .2 }) {
    const t0 = ac.currentTime + at, src = ac.createBufferSource();
    src.buffer = noiseBuf; src.loop = true; src.playbackRate.value = rnd(.9, 1.1);
    const fl = ac.createBiquadFilter(); fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f, t0); if (f2 !== f) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = ac.createGain(); env(g, t0, gain, attack, dur);

    const t0 = ac.currentTime + at, o = ac.createOscillator();
    o.frequency.setValueAtTime(f, t0); if (f2 !== f) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    const g = ac.createGain(); env(g, t0, gain, attack, dur); o.connect(g); send(g, pan, wet);
    o.start(t0); o.stop(t0 + dur + .05);

  const panX = x => (x / W - .5) * 1.1;          // x in world cells
  // building blocks
  const pierce = (p, at = 0, g = 1) => {         // the point goes through: a tiny click, and the cloth gives
    noise({ at, dur: rnd(.025, .04), f: rnd(3200, 4800), q: 2.5, gain: .16 * g, attack: .002, pan: p, wet: .1 });
    noise({ at: at + .004, dur: .06, type: "lowpass", f: 900, gain: .05 * g, attack: .003, pan: p, wet: 0 });
  };
  const pull = (p, at = 0, dur = .3, g = 1) =>   // thread drawn through and pulled tight: a narrow band sweeping up
    noise({ at, dur, f: rnd(900, 1200), f2: rnd(2600, 3400), q: 5, gain: .07 * g, attack: dur * .7, pan: p, wet: .25 });
  const rustle = (p, at = 0, dur = .4, g = 1, n = 4) => { // cloth moving: a few small, uneven crinkles
    for (let i = 0; i < n; i++) noise({ at: at + rnd(0, dur * .8), dur: rnd(.08, .22), f: rnd(1400, 4200), q: rnd(.6, 1.4),
      gain: .06 * g, attack: rnd(.02, .06), pan: p + rnd(-.12, .12), wet: .3 });
  };

    for (let i = 0; i < notes; i++) tone({ at: at + i * rnd(.05, .09), dur: rnd(.9, 1.4), f: SILVER[Math.floor(rnd(0, SILVER.length))],

    for (let i = 0; i < n; i++) { const a = at + i * rnd(.065, .09), f = SILVER[i];
      tone({ at: a, dur: rnd(1.4, 1.9), f, gain: .02 * g, attack: .006, pan: p + (i - n / 2) * .05, wet: .55 });
      tone({ at: a, dur: .45, f: f * 2.76, gain: .005 * g, attack: .004, pan: p, wet: .6 }); }

    tone({ at, dur: .16, f: 120, f2: 55, gain: .16 * g, attack: .004, pan: p, wet: .1 });
    noise({ at, dur: .12, type: "lowpass", f: 450, gain: .1 * g, attack: .004, pan: p, wet: .1 });
  };
  const S = {
    wake, toggleMute() { muted = !muted; if (out) out.gain.setTargetAtTime(muted ? 0 : .9, ac.currentTime, .05); },
    // her moves (x = world x of the cell she leaves)
    step(x, dur) { if (!ready()) return; const p = panX(x);          // gliding stitch: in, along, and up with the thread
      pierce(p, .02, .7); swish(p, 0, dur * .9, 1600, 2200, .025); pull(p, dur * .45, dur * .5, .55); },
    slide(x, dur) { if (!ready()) return;                            // Ala zhip: lying along the band, a smooth hiss
      noise({ dur: dur * 1.2, f: rnd(2300, 2800), q: 1.2, gain: .045, attack: dur * .35, pan: panX(x), wet: .3 }); },
    settle(x) { if (!ready()) return; rustle(panX(x), 0, .25, .5, 2); },
    hop(x, dur) { if (!ready()) return; swish(panX(x), 0, dur, 500, 1400, .035); },   // Koshkar muiyz: up over the seam
    land(x) { if (!ready()) return; const p = panX(x); thump(p); pierce(p, .14, .9); },
    // the arrival: a soft rush of air as she floats down and the touch of her point on the cloth. No silver tones:
    // those belong to Zhuldyz alone. Before the first gesture the browser keeps audio asleep, so then it is silent.
    arrive(x, landAt) { if (!ready() || ac.state !== "running") return; const p = panX(x);
      if (landAt > .1) swish(p, 0, landAt, 2600, 900, .03);

    dive(x, dur) { if (!ready()) return; const p = panX(x);          // Zhuldyz: down into the star...
      swish(p, 0, dur, 3000, 400, .06); thump(p, dur * .85, .5); },
    rise(x, dur) { if (!ready()) return; const p = panX(x);          // ...and up through its partner
      swish(p, 0, dur * .9, 400, 2600, .05); glint(p, dur * .3, .8, 2); },
    snag(x) { if (!ready()) return; const p = panX(x);               // stopped at a seam: the thread catches
      noise({ dur: .16, f: 1400, f2: 700, q: 4, gain: .06, attack: .02, pan: p, wet: .2 });
      noise({ at: .02, dur: .08, type: "lowpass", f: 320, gain: .08, attack: .004, pan: p, wet: 0 }); },
    // sewing (dur = how long the new cloth takes to spread)
    sewSeam(x, dur) { if (!ready()) return; const p = panX(x);
      pierce(p); pull(p, .06, .35); rustle(p, .2, dur, .7, 5); },
    sewBand(x, dur) { if (!ready()) return; const p = panX(x);       // the strips pull through one after another
      pierce(p); for (let i = 0; i < 3; i++) pull(p + i * .05, .05 + i * .14, .3, .8); rustle(p, .25, dur, .7, 6); },
    sewStar(x1, x2, dur) { if (!ready()) return;

    // the panel and the quilt

    shake() { if (!ready()) return;                                  // restart: the quilt is shaken out

    // the scissors snip the thread: two crisp blade clicks with a bright ring of steel, then the silver closes the quilt

// ---------- Game state ----------
// Seams are cell edges between two different pieces (or a piece and the frame). Every ornament both decorates the quilt
// and joins the walkable network:
//   Koshkar muiyz — a band on one seam segment: a bridge she jumps across, both ways.
//   Ala zhip      — a diagonal band of 1..n steps from a reachable cell, crossing up to 3 pieces: she glides along it.
//   Zhuldyz       — a level-placed star pair: a two-way portal, plus a 3x3 star block at each end that opens its inner seams.
// Piecing blocks (experimental, working names; see DESIGN.md §4):
//   Friendship star  — tap a 3x3 block: it turns a quarter round its centre, carrying the fabrics with it.
//   Framed square    — tap a small patch: a frame is quilted round it and every seam it has opens.
//   Log cabin corner — drag diagonally from a cell: L-shaped logs grow round it (2x2 to 4x4); seams inside open.
//   Sawtooth border  — drag along the canvas edge: a straight run across up to 3 pieces she runs along.
//   Rickrack         — drag along the binding: a trim that lets her step off the binding anywhere along it.
//   Quilting wave    — drag a free, wandering path (up to 8 steps, 3 seams): she floats along it.
// Anything touching the area she can walk to can be sewn; after she arrives, the whole quilt is yours to finish.
let state;            // see reset()
const dynamic = [];   // meshes to clear on restart
const seamHints = [];
// Each level lists its ornaments (default: the three from the flyer). ?orn=all shows every one, for playtests.
// A level without stars has no use for Zhuldyz, nor one without a binding for Rickrack, so those icons are left out.
const ALL_ORNS = ["koshkar", "ala", "star", "pinwheel", "framed", "logcabin", "sawtooth", "rickrack", "wave"];
const ORNS = (PARAMS.get("orn") === "all" ? ALL_ORNS : (LEVEL.ornaments || ["koshkar", "ala", "star"]))
  .filter(o => (o !== "star" || HAS_TWINS) && (o !== "rickrack" || FR));
for (const b of document.querySelectorAll(".orn")) if (!ORNS.includes(b.dataset.orn)) b.remove();
const panel = document.getElementById("panel"), ornBtns = [...document.querySelectorAll(".orn")];
const restartBtn = document.getElementById("restart"), saveBtn = document.getElementById("save");
const ALA_MAX_PIECES = 3;

function reset() {
  for (const m of dynamic) scene.remove(m); dynamic.length = 0;
  own.clear(); for (const [k, v] of OWN0) own.set(k, v);
  resetQuilt();
  state = { cell: [...LEVEL.start], busy: false, won: false, tied: false, pending: null, blockedEdge: null, orn: null, retarget: null,
    stitched: new Set(),   // Koshkar bridges (edge keys)
    open: new Set(),       // seams opened by a star block: plain walking, no jump
    diag: new Set(),       // Ala zhip steps (edge keys of diagonal neighbours)
    diagLinks: new Map(),  // "x,y" -> [cells] along Ala zhip bands
    portal: new Map(),     // "x,y" -> partner cell
    covered: new Set(),    // "x,y" cells already under an ornament (the Friendship star can't turn those)
    style: new Map(),      // edge key -> "run" (Sawtooth) | "float" (Quilting wave): how she crosses an opened edge
    framed: new Set() };   // "x,y" cells of patches already framed
  girl.position.set(state.cell[0] + .5, state.cell[1] + .5, Z_GIRL); girlReset(); introStart();
  scissorsReset(); scissorsPlace();
  showPanel(); setOrn(null); restartBtn.classList.remove("pulse"); hideSave();
}

const isOpen = (a, b) => state.stitched.has(ekey(a, b)) || state.open.has(ekey(a, b));
const isPortal = (a, b) => String(state.portal.get(String(a))) === String(b);
// Every cell one step away: the four neighbours, plus Ala zhip and portal links.
function links(c) {
  const out = N4.map(([dx, dy]) => [c[0] + dx, c[1] + dy]), k = String(c);
  if (state.diagLinks.has(k)) out.push(...state.diagLinks.get(k));
  if (state.portal.has(k)) out.push(state.portal.get(k));
  return out;
}
// Can she take one step from a to b without new sewing?
function canStep(a, b) {
  if (!inside(...b)) return false;
  if (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) !== 1) return state.diag.has(ekey(a, b)) || isPortal(a, b);
  const oa = ownerAt(...a), ob = ownerAt(...b);
  if (oa === ob || isOpen(a, b)) return true;
  if (ob === "frame" && FR.enter === "free") return true;
  if (oa === "frame" && FR.exit === "free") return true;
  return false;
}
// Every cell she can walk to from where she stands (null once she has finished: everything is open to sew).
function reachable() {
  if (state.won) return null;
  const seen = new Set([String(state.cell)]), q = [state.cell];
  while (q.length) { const c = q.shift();
    for (const n of links(c)) if (!seen.has(String(n)) && canStep(c, n)) { seen.add(String(n)); q.push(n); } }
  return seen;
}
const canReach = (c, reach = reachable()) => !reach || reach.has(String(c));
const coverCells = cells => { for (const c of cells) state.covered.add(String(c)); };
function isSeam(a, b) { return inside(...a) && inside(...b) && ownerAt(...a) !== ownerAt(...b); }
function sewable(a, b, reach = reachable()) {
  return isSeam(a, b) && !isOpen(a, b) && (canReach(a, reach) || canReach(b, reach));
}
// Distance of every cell that can reach `target` (steps can be one-way, so search backwards; extra links are two-way).
function distTo(target) {
  const dist = new Map([[String(target), 0]]), q = [target];
  while (q.length) {
    const c = q.shift();
    for (const n of links(c)) { const k = String(n);
      if (!dist.has(k) && inside(...n) && canStep(n, c)) { dist.set(k, dist.get(String(c)) + 1); q.push(n); } }
  }
  return dist;
}
// Shortest path that hugs the straight line from `from` to `to`, so she visibly heads where you tapped.
function straightestPath(from, to, dist) {
  const out = [], [ax, ay] = from, lx = to[0] - ax, ly = to[1] - ay, len = Math.hypot(lx, ly) || 1;
  const off = c => Math.abs((c[0] - ax) * ly - (c[1] - ay) * lx) / len;
  let cur = from;
  while (String(cur) !== String(to)) {
    const d = dist.get(String(cur));
    const opts = links(cur).filter(n => dist.get(String(n)) === d - 1 && canStep(cur, n));
    opts.sort((a, b) => off(a) - off(b) || Math.hypot(a[0] - to[0], a[1] - to[1]) - Math.hypot(b[0] - to[0], b[1] - to[1]));
    cur = opts[0]; out.push(cur);
  }
  return out;
}
// Walk the straight line from a toward b one edge at a time. Returns the walkable prefix and the first blocked cell.
// When the line passes exactly through a cell corner, take whichever of the two steps is walkable.
function walkLine(a, b) {
  const path = []; let [x, y] = a; const dx = Math.abs(b[0] - x), dy = Math.abs(b[1] - y), sx = Math.sign(b[0] - x), sy = Math.sign(b[1] - y);
  let ix = 0, iy = 0;
  while (ix < dx || iy < dy) {
    const tx = (0.5 + ix) * dy, ty = (0.5 + iy) * dx, cx = [x + sx, y], cy = [x, y + sy];
    let stepX = tx < ty;
    if (tx === ty && ix < dx && iy < dy) stepX = canStep([x, y], cx) || !canStep([x, y], cy);
    const next = stepX ? cx : cy;
    if (!canStep([x, y], next)) return { path, blocked: next };
    if (stepX) ix++; else iy++;
    [x, y] = next; path.push(next);
  }
  return { path, blocked: null };
}

// ---------- Moving ----------
// Every move is a sewing gesture of the needle fairy (G.pose; see girlTick).
async function standUp() {                                  // after lying flat along an Ala zhip band
  const P = G.pose, r0 = P.rot; G.laying = false;
  SFX.settle(girl.position.x);
  await tween(240 * slow, t => { P.rot = r0 * (1 - easeInOut(t)); P.lift = .04 * (1 - t); });
  P.rot = 0; P.lift = 0; P.flat = false;
}
async function walk(path) {
  const P = G.pose;
  for (let i = 0; i < path.length; i++) {
    const c = path[i];
    if (state.retarget) { if (P.flat) await standUp(); await settle(); return "retarget"; }   // a new tap while walking: change course at the next cell
    const prev = state.cell, from = girl.position.clone(), to = CELL_C(...c); to.z = Z_GIRL;
    const dir = Math.sign(to.x - from.x); if (dir) G.facing = dir;
    const gFrom = [from.x, from.y - GY], gTo = [to.x, to.y - GY];
    if (isPortal(prev, c)) {
      // Zhuldyz: she dives straight down into the star's centre and comes up through its partner
      if (P.flat) await standUp(); await settle();
      G.laying = false;
      SFX.dive(from.x, .52 * slow);
      await tween(520 * slow, t => { P.sink = 1.05 * t; P.rot = 0; }, easeInOut);
      girl.position.copy(to);
      SFX.rise(to.x, .7 * slow);
      await tween(700 * slow, t => { P.sink = 1.05 * (1 - easeOutBack(t)); });
      P.sink = 0;
      state.cell = c;
      if (String(c) === String(LEVEL.goal)) return true;
      continue;
    }
    const nx = path[i + 1];
    if (state.diag.has(ekey(prev, c))) {
      // Ala zhip: she lies down along the band, point first, and slides like a needle along a seam
      const ang = Math.atan2(to.y - from.y, to.x - from.x) + Math.PI / 2;
      if (!P.flat) { await settle(); P.flat = true; G.laying = true; SFX.settle(from.x); await tween(220 * slow, t => { P.rot = ang * easeInOut(t); P.lift = .04 * t; }); }
      P.rot = ang;
      SFX.slide(from.x, .42 * slow);
      await tween(420 * slow, t => girl.position.lerpVectors(from, to, t));
      if (!(nx && state.diag.has(ekey(c, nx)))) await standUp();
    } else {
      if (P.flat) await standUp();
      const style = state.style.get(ekey(prev, c));
      if (style === "float") {
        // Quilting wave: she sews along the meander, two shallow stitches a cell, swaying with it
        G.laying = true;
        const r0 = P.rot;
        SFX.step(from.x, .62 * slow);
        await tween(620 * slow, t => { girl.position.lerpVectors(from, to, t); const s = Math.sin(t * Math.PI * 2) * .12;
          girl.position.x += s * (to.y - from.y); girl.position.y -= s * (to.x - from.x); glidePose(t, r0, dir, { depth: .4, waves: 2 }); });
      } else if (style === "run") {
        // Sawtooth border: quick, short stitches along the teeth
        G.laying = true;
        const r0 = P.rot;
        SFX.step(from.x, .24 * slow);
        await tween(240 * slow, t => { girl.position.lerpVectors(from, to, t); glidePose(t, r0, dir, { depth: .3, lean: .4 }); });
      } else if (state.stitched.has(ekey(prev, c))) {
        // Koshkar muiyz: she arcs over the seam, lands point first and pierces the far side; a stitch spans the seam

  star: (tapped = null) => starGo(tapped), twins: () => twinPieces(state.cell),
  sewable: (a, b) => sewable(a, b), alaPlan, reachable: () => reachable(), level: LEVEL.id, seed: SEED, quilt: LEVEL,
  get state() { return state; }, scissors: () => ({ ...K }), png: quiltPng, save: saveQuilt, hintCount: () => seamHints.length,
  toClient: ([wx, wy]) => { const r = canvasEl.getBoundingClientRect();
    return [r.left + ((wx - camera.position.x) / ((camera.right - camera.left) / 2) + 1) / 2 * r.width,
            r.top + (1 - ((wy - camera.position.y) / ((camera.top - camera.bottom) / 2) + 1) / 2) * r.height]; } };
window.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") restartQuilt();
  if ((e.key === "s" || e.key === "S") && K.done) saveQuilt();
  if (e.key === "m" || e.key === "M") SFX.toggleMute(); });

// ---------- Legend: what the ornaments mean ----------
// The meanings are the ones @by.rabat wrote on the flyer that came with the pillowcases (sources/context/README.md).
// Only the three ornaments and the green are explained; the piecing blocks' names and meanings are not known yet.
const LEGEND = {
  koshkar: { name: "Qoshqar muiyz", kk: "Қошқар мүйіз · ram’s horns",
    text: ["A symbol of sufficiency, well-being and abundance."],
    game: "In the game it sews two pieces together, making a two-sided ornament." },
  ala: { name: "Ala zhip", kk: "Ала жіп · the motley thread",
    text: ["A symbol of honesty, conscience and justice."],
    game: "In the game it goes diagonally: the straightforward way across." },
  star: { name: "Zhuldyz", kk: "Жұлдыз · star",
    text: ["A symbol of light, hope and striving toward new goals."],
    game: "In the game it teleports you to another piece cut from the same cloth. Both ends become stars you can step through again." },
  green: { name: "Green", kk: "the frame round the quilt",
    text: ["A symbol of life, nature, renewal and harmony."],
    game: "In the game the frame lets you reach the parts of the canvas you need without unnecessary stitches." },
};
const legendEl = document.getElementById("legend"), legendCard = document.getElementById("legend-card"), legendShade = document.getElementById("legend-shade");
const swatches = [...legendEl.querySelectorAll(".swatch")];
for (const b of swatches) if (b.dataset.legend !== "green" && !ORNS.includes(b.dataset.legend)) b.remove();
const legendOpen = () => legendCard.classList.contains("show");
function legendClose() {
  legendCard.classList.remove("show"); legendShade.classList.remove("show");
  const b = swatches.find(b => b.getAttribute("aria-expanded") === "true");
  if (b) { b.setAttribute("aria-expanded", "false"); b.focus({ preventScroll: true }); }
}
function legendShow(b) {
  const L = LEGEND[b.dataset.legend], icon = document.querySelector(`.orn[data-orn="${b.dataset.legend}"] svg`);
  legendCard.replaceChildren();
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; legendCard.append(e); return e; };
  el("h2", "", L.name); el("div", "kk", L.kk); for (const t of L.text) el("p", "", t);
  // what it does in the game, next to the tool in the tray that sews it (the green has no tool)
  const t = el("div", "tool"); if (icon) t.append(icon.cloneNode(true)); t.append(L.game);
  for (const s of swatches) s.setAttribute("aria-expanded", String(s === b));
  legendShade.classList.add("show"); legendCard.classList.add("show");
  // beside the swatch (landscape) or under it (portrait), kept on screen
  const r = b.getBoundingClientRect(), side = matchMedia("(max-aspect-ratio: 6/5)").matches, c = legendCard.getBoundingClientRect();
  let x = side ? r.left : r.right + 14, y = side ? r.bottom + 12 : r.top + r.height / 2 - c.height / 2;
  x = Math.max(16, Math.min(x, innerWidth - c.width - 16)); y = Math.max(16, Math.min(y, innerHeight - c.height - 16));
  legendCard.style.left = x + "px"; legendCard.style.top = y + "px";
}
for (const b of swatches) b.addEventListener("click", e => { e.stopPropagation();
  if (b.getAttribute("aria-expanded") === "true") legendClose(); else legendShow(b); });
// any tap outside the card closes it, and that tap does nothing else (she does not walk)
legendShade.addEventListener("pointerdown", e => { e.preventDefault(); e.stopPropagation(); legendClose(); });
window.addEventListener("keydown", e => { if (e.key === "Escape" && legendOpen()) legendClose(); });

// ---------- Loop ----------
reset();
function update(now) {
  for (const tw of [...tweens]) { const t = Math.min(1, (now - tw.t0) / tw.dur); tw.fn(tw.ease(t)); if (t >= 1) { tweens.delete(tw); tw.res(); } }
  const pulse = .45 + .4 * Math.sin(now / 300); for (const m of seamHints) m.material.opacity = pulse * (m.userData.k ?? 1);
  flushQuilt();
  girlTick(now);
  scissorsTick(now, Math.min(.05, (now - (update.last || now)) / 1000)); update.last = now;
  renderer.render(scene, camera);
}
window.quraqDebug.update = () => update(performance.now());
(function frame(now) { update(now); requestAnimationFrame(frame); })(performance.now());
})();
</script>
